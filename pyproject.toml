[project]
name = "vrtool"
version = "1.1.1"
description = "veiligheidsrendement tool (core and orm)"
authors = [{name = "Wouter Jan Klerk", email = "wouterjan.klerk@deltares.nl"}]
maintainers = [
  {name = "Carles S. Soriano Pérez", email = "carles.sorianoperez@deltares.nl"},
  {name = "Ardt Klapwijk", email = "ardt.klapwijk@deltares.nl"},
  {name = "Stephan Rikkert", email = "stephan.rikkert@deltares.nl"},
]
readme = "README.md"
keywords = ["civil-engineering", "dikes", "flood-defence", "deltares"]
classifiers = [
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Natural Language :: English',
  'Intended Audience :: Science/Research',
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: GIS',
  'Topic :: Scientific/Engineering :: Mathematics',
  'Topic :: Scientific/Engineering :: Physics',
  'Topic :: Scientific/Engineering :: Hydrology',
]
requires-python = ">=3.12,<3.15"
dependencies = ["matplotlib", "numpy", "pandas", "shapely", "scipy", "seaborn", "openturns", "openpyxl", "click", "peewee", "d-geolib>=2.8.0,<3", "tqdm"]

[project.urls]
homepage = "https://deltares-research.github.io/VrtoolDocumentation/"
documentation = "https://deltares-research.github.io/VrtoolDocumentation/"
repository = "https://github.com/Deltares/veiligheidsrendement"
issues = "https://github.com/Deltares/veiligheidsrendement/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64","osx-arm64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
vrtool = { path = ".", editable = true }
build = "*"

[tool.pixi.tasks]
migrate_test_db = "scripts.migration.migrate_test_databases:migrate_test_databases"
update_reference_dbs = "scripts.update_reference_dbs:update_reference_dbs"

[tool.pixi.dependencies]
python = ">=3.12,<3.15"
matplotlib = ">3.7.0"
numpy = ">=1.26.4"
pandas = ">=1.5.3"
shapely = ">=2.0.1"
scipy = ">=1.8.1"
seaborn = ">=0.12.2"
openturns = ">=1.25"
openpyxl = ">=3.1.1"
click = ">=8.1.3"
peewee = ">=3.16.1"
tqdm = ">=4.66.2"


[tool.pixi.feature.test.dependencies]
pytest = ">=7.2.1"
pytest-cov = ">=3.0.0"
coverage = ">=6.4.4"
teamcity-messages = ">=1.32"
pytest-xdist = ">=3.3.1"
pytest-profiling = ">=1.7.0"
pywin32 = ">=311"

[tool.pixi.feature.dev.dependencies]
black = ">=22.8.0"
isort = ">=5.10.1"
commitizen = ">=3.0.1"
urllib3 = "1.26.15"

[tool.pixi.feature.dev.tasks]
isort = "isort"
black = "black"
build = "python -m build --outdir dist/"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
dev = { features = ["dev", "test"], solve-group = "default" }
py312 = ["py312", "default"]
py313 = ["py313", "default"]
py314 = ["py314", "default"]


[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
(
  /(
      \.git         # exclude a few common directories in the
    | \.github          # root of the project
    | \.env
    | \.venv
    | \.devcontainer
    | \.pixi
    | .pytest_cache
    | .scannerwork
    | .vscode
    | site
  )/
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
skip = [
  ".git",
  ".github",
  ".pixi",
  ".env",
  ".venv",
  ".devcontainer",
  ".pytest_cache",
  ".scannerwork",
  ".vscode",
  "site",
]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "regenerate_test_db: tests which simply generate new database references (select with `-m \"regenerate_test_db\" --no-skip`)",
  "externals: marks tests that require of external binaries (deselect with '-m \"not externals\"')",
  "fixture_database: allows to define which database will be used in a fixture; check `tests.orm.conftest.py` for usages",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.1.1"
tag_format = "v$major.$minor.$patch"
changelog_file = "docs/changelog.md"
version_files = ["vrtool/__init__.py", "pyproject.toml:version"]
